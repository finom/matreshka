name: Publish

# A `<dir>-v<version>` tag, pushed by `PACKAGE=<dir> npm run patch|minor`, publishes every package version npm does not
# have yet. A manual run is a dry run: npm publish --dry-run, and the release text goes to the run summary.
on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:

permissions: read-all

# Tags of one release publish one after another; a later run finds the versions already on npm.
# Dry runs queue apart, so one never takes the place of a pending real run.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'publish-dry-run' || 'publish' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # a GitHub Release per tag
      id-token: write # npm trusted publishing (OIDC), which adds provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:dist
      # A mistyped tag would otherwise publish whatever versions the tree holds.
      - name: Check the tag matches its package
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dir="${TAG%-v*}"
          version="$(node -p "require('./packages/$dir/package.json').version")"
          if [ "$TAG" != "$dir-v$version" ]; then
            echo "tag $TAG does not match packages/$dir at $version" >&2
            exit 1
          fi
      # A GitHub Release carries its version's CHANGELOG section, so a version without one never reaches npm.
      - name: Check the CHANGELOG has a section for every version npm lacks
        run: |
          for dir in matreshka router parse-form; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            [ -n "$(npm view "$name@$version" version 2>/dev/null)" ] && continue
            node scripts/changelog-section.mjs "packages/$dir/CHANGELOG.md" "$version" >/dev/null
          done
      - name: Publish every version not yet on npm
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -o pipefail
          for dir in matreshka router parse-form; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is on npm"
              continue
            fi
            # A prerelease goes to the dist-tag its id names (0.3.0-beta.1 → beta), a release to latest.
            case "$version" in
              *-*) tag="${version#*-}"; tag="${tag%%.*}" ;;
              *) tag=latest ;;
            esac
            args=(--workspace "packages/$dir" --access public --tag "$tag")
            [ "$DRY_RUN" = true ] && args+=(--dry-run)
            # npm validates a new version for a few minutes, unseen by npm view, so a later run may try it again.
            npm publish "${args[@]}" 2>&1 | tee publish.log ||
              grep -qE "previously (staged|published) version" publish.log
          done
      # The release carries the version's CHANGELOG section, and the npm provenance as an in-toto file, which is what
      # Scorecard's Signed-Releases reads. A dry run writes the text of each version npm lacks to the run summary.
      - name: A GitHub Release per pushed tag, with the CHANGELOG section and the npm provenance
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -o pipefail
          for dir in matreshka router parse-form; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            version="$(node -p "require('./packages/$dir/package.json').version")"
            tag="$dir-v$version"
            file="$tag.intoto.jsonl"
            if [ "$DRY_RUN" = true ]; then
              [ -n "$(npm view "$name@$version" version 2>/dev/null)" ] && continue
            else
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null || continue
              # A release that has its provenance is done; its text stays as it is.
              gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -qxF "$file" && continue
            fi
            node scripts/changelog-section.mjs "packages/$dir/CHANGELOG.md" "$version" >notes.md
            printf '\n[Full changelog](https://github.com/%s/blob/%s/packages/%s/CHANGELOG.md) · [npm](https://www.npmjs.com/package/%s/v/%s)\n' \
              "$GITHUB_REPOSITORY" "$tag" "$dir" "$name" "$version" >>notes.md
            if [ "$DRY_RUN" = true ]; then
              { echo "## $name $version (dry run)"; echo; cat notes.md; echo; } | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # The attestations appear once npm serves the version, a few minutes after the publish.
            curl -fsSL --retry 40 --retry-delay 15 --retry-all-errors \
              "https://registry.npmjs.org/-/npm/v1/attestations/${name/\//%2f}@$version" |
              jq -ce '.attestations[] | select(.predicateType | startswith("https://slsa.dev/provenance/")) | .bundle.dsseEnvelope' \
                >"$file"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$file" --clobber
              gh release edit "$tag" --notes-file notes.md
            else
              gh release create "$tag" "$file" --verify-tag --title "$name $version" --notes-file notes.md
            fi
          done
