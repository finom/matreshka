<!DOCTYPE html>
<html>
	<head>
		<title>Matreshka.js SoundCloud Search</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
		<style>
			.track {
				margin: 20px 0;
			}

			.track img {
				float: left;
				margin-right: 10px;
			}

			audio {
				float: right;
				width: calc( 100% - 110px );

			}

			.track:after {
				content: ".";
				display: block;
				height: 0;
				clear: both;
				visibility: hidden;
			}

			.track .title {
				margin-top: 20px;
			}
		</style>
	</head>
	<body>
		<main class="container py-6 vstack gap-4">
			<header>
				<h1>Matreshka.js SoundCloud Search</h1>
			</header>
			<div class="alert theme-warning">
				<div>This demo no longer finds anything: SoundCloud's API now asks for an OAuth access token, and the
				public client ID the demo sends is refused with <code>401 Unauthorized</code>. The code still shows
				how a <code>Matreshka.Array</code> renders and plays a list of tracks.</div>
			</div>
			<form class="search">
				<div class="input-group">
					<input type="search" class="form-control query" placeholder="Search">
					<button type="submit" class="btn btn-solid theme-primary">Search</button>
				</div>
			</form>
			<div class="row tracks">
				<script type="text/html" id="track_template">
					<div class="md:col-6 track">
						<img class="artwork">
						<h4 class="title"></h4>
						<audio controls preload="none"></audio>
					</div>
				</script>
			</div>
		</main>

		<script src="/matreshka.min.js"></script>
		<script src="js/track.class.js"></script>
		<script src="js/tracks.class.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
