<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matreshka Example App (Login form)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css">
</head>

<body>
    <main class="container py-6">
        <div class="row">
            <div class="md:col-6 lg:col-4 mx-auto">
                <form class="card login-form">
                    <div class="card-body vstack gap-3">
                        <h1 class="h4">Sign in</h1>
                        <div class="form-field">
                            <label class="form-label" for="user-name">Username</label>
                            <input type="text" id="user-name" class="user-name form-control" placeholder="At least 4 characters">
                        </div>
                        <div class="form-field">
                            <label class="form-label" for="password">Password</label>
                            <input type="password" id="password" class="password form-control" placeholder="At least 5 characters">
                        </div>
                        <div class="form-field">
                            <input type="checkbox" id="show-password" class="check show-password">
                            <label for="show-password">Show password</label>
                        </div>
                        <div class="form-field">
                            <input type="checkbox" id="remember-me" class="check remember-me">
                            <label for="remember-me">Remember me</label>
                        </div>
                        <input type="submit" value="Sign in" class="btn btn-solid theme-primary submit">
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="/matreshka.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
